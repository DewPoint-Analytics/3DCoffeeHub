<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#fdf7ec 0%,#f6e8cf 55%,#e9d2ad 100%)}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:14px;background:var(--band);opacity:.9;z-index:1;pointer-events:none}

canvas{display:block;outline:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 26px;z-index:5;pointer-events:none;background:linear-gradient(#fbf3e4f2 55%,#fbf3e400)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:10px;background:var(--band);background-size:16px 10px;opacity:.75}
.brand{pointer-events:auto;display:flex;flex-direction:column;color:var(--rose);text-decoration:none}

.pin .n{width:34px;height:40px;display:grid;place-items:center;padding-top:6px;background:var(--paper);color:var(--rose);font:700 14px 'DM Sans';position:relative;clip-path:path('M17 0 C19 6 34 12 34 22 L34 40 L0 40 L0 22 C0 12 15 6 17 0Z');filter:none}
.pin::before{content:"";position:absolute;left:-3px;top:-3px;width:40px;height:46px;background:var(--caramel);clip-path:path('M20 0 C22 7 40 13 40 25 L40 46 L0 46 L0 25 C0 13 18 7 20 0Z');z-index:-1;opacity:.95}
.pin .n::after{content:none}

@keyframes glow{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

.panel.open{transform:none}

.panel .x:hover{background:var(--rose);color:#fffaf1}
.kick{font:700 11px 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--caramel);text-align:left}

.chart{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:0 0 14px;position:relative}
.chart h4{margin:0 0 10px;font:700 11px 'DM Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.facts li::before{content:"";flex:0 0 8px;height:8px;margin-top:6px;transform:rotate(45deg);background:var(--blush);box-shadow:0 0 0 1.5px var(--copper)}

.loader::before{content:"";position:absolute;width:150px;height:200px;left:50%;top:50%;transform:translate(-50%,-62%);border:2px solid rgba(122,51,32,.35);border-bottom:0;clip-path:path('M75 0 C80 30 150 50 150 100 L150 200 L0 200 L0 100 C0 50 70 30 75 0Z');background:linear-gradient(#fbf7ee,#f4e3c4)}
.loader.hide{visibility:hidden;transition:opacity .6s,visibility 0s .6s;opacity:0;pointer-events:none}
.loader div{text-align:center;font:600 22px 'Playfair Display',serif;position:relative;margin-top:120px}
.loader span{display:block;margin-top:8px;font:500 13px 'DM Sans';color:var(--caramel);letter-spacing:.18em;text-transform:uppercase}
.fallback{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);padding:90px 20px 40px;z-index:3}
.fallback.show{display:block}
.fallback .grid{max-width:900px;margin:0 auto;display:grid;gap:16px}
.fallback article{background:var(--paper);border-radius:18px;padding:22px;box-shadow:0 0 0 1px var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){
 .panel{left:14px;right:14px;width:auto;top:auto;bottom:88px;max-height:52vh;border-radius:160px 160px 18px 18px/40px 40px 18px 18px;transform:translateY(calc(100% + 120px))}
 .panel::before{margin:18px 50px 0}
 .panel .x{top:34px;right:14px}
 .pscroll{padding:12px 20px 18px}
 .panel h2{font-size:23px}
 .hint{display:none}
 .dock{bottom:18px}.dock .btn.lbl{display:none}

 .pin .t{display:none}
 .top{padding:12px 14px 22px}
 .brand small{font-size:9.5px;letter-spacing:.16em}.back{padding:8px 12px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}.panel{transition:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- Content: every figure is from my own runs ---------------- */
const SRC='Source: own runs of Coffee Shop Inc. (Sim Institute / Harvard Business Impact), Oct–Nov 2026.';
const STATIONS=[
{id:'door',name:'Front door',kick:'Station 1 · Where to open',title:'Location <em>mattered most</em>',
 lede:'Level 1 put one shop in three places under identical news. The City Centre produced the highest profit of the locations tested; the low-rent Campus narrowly missed its target.',
 chart:{title:'Five-year profit, Level 1 (target $500,000)',rows:[['City Centre',740214],['Suburb',662589],['University Campus',494089]],target:500000},
 facts:['City Centre beat the Campus by $246,125 over five years.','The Campus missed by $5,911; a failed evening test cost about $20,600 that year.','Low rivalry and low rent could not make up for $1 vending machines and price-sensitive students.'],
 note:'Location comparisons are descriptive: pay, training or promotion also differed slightly between these runs.',
 anchor:[7.75,3.85,3.4],cam:[12.2,4.4,11.2],tgt:[6.9,1.9,3.9]},
{id:'counter',name:'Counter & menu',kick:'Station 2 · Price with the economy',title:'Match rivals in a recession, <em>charge more in recovery</em>',
 lede:'The menu board followed the news. In the Year 4 recession I matched competitors’ prices; in the Year 5 recovery I raised them.',
 chart:{title:'Year 5 recovery: price rise vs volume change',rows:[['Mature price',14.3],['Mature volume',-5.2],['Emerging price',20],['Emerging volume',-4.7]],unit:'%'},
 facts:['Recession: matching the market price lifted Level 1 drinks from 447 to 477 a day and Level 3 Mature drinks per store by 6.5%.','Recovery: volume fell proportionately less than prices rose, consistent with relatively inelastic demand.','A price below rivals was never tested.'],
 note:'Market conditions changed at the same time, so these are not clean elasticity estimates.',
 anchor:[0,4.45,-4.75],cam:[0.3,4.3,1.0],tgt:[0,3.4,-5.2]},
{id:'staff',name:'Staff room',kick:'Station 3 · People',title:'Pay a little more, <em>keep training</em>',
 lede:'The game links happy staff to happy customers. A modest pay lead kept staff at five stars; cutting training or holding an extra job did not pay.',
 chart:{title:'Profit effect of each people decision',rows:[['$1,000 pay lead (not $2,000)',14359],['Promotion trimmed to $10,000',9718],['Training cut to $1,000',-6888],['One extra job kept 5 years',-122794]]},
 facts:['Staff stayed at five stars with a $1,000 lead during the recession and recovery.','Cutting training saved $4,500 but lost more in sales (−$6,888).','An extra job lifted demand only in the year it was added.'],
 note:'Paired runs with otherwise identical settings (Level 1 Runs 1, 4 and 5; Level 2 Runs 2 and 3).',
 anchor:[4.9,3.7,-4.75],cam:[3.2,3.0,0.6],tgt:[4.9,2.0,-4.4]},
{id:'roaster',name:'Roastery',kick:'Station 4 · Vertical integration',title:'Roast only where <em>customers notice</em>',
 lede:'A $100,000 roaster saves only $0.05 a cup. It paid when customers valued the taste, and lost money where they did not.',
 chart:{title:'Five-year profit effect of roasting own beans',rows:[['Level 2 · City Centre',134049],['Level 3 · Mature Markets',583995],['Level 3 · Emerging Markets',-157785]]},
 facts:['In Level 2 the gain came from more customers ($194,237), not cheaper cups ($39,812), against $100,000 of depreciation.','Mature customers added about 20 drinks per store per day.','Rivals began roasting in Year 2, so the advantage was temporary.'],
 note:'Level 3 effects compare Run 3 with Run 2, market by market.',
 anchor:[7.0,3.3,-3.3],cam:[3.4,4.0,2.4],tgt:[7.4,1.2,-3.6]},
{id:'beans',name:'Bean shelf',kick:'Station 5 · Sourcing',title:'Certified beans pay <em>when the label is trusted</em>',
 lede:'Organic sourcing served the planet goal and profit together. Where Fair Trade labels were credible, combining both sold even more.',
 chart:{title:'Profit effect of certified beans',rows:[['Organic beans, Level 2 (5 years)',49916],['Fair Trade + organic, Level 3 Year 1',46938]]},
 facts:['Organic beans lifted sales 3.0–4.1% a year and returned about twice their cost.','Fair Trade + organic sold 5.6% more per Mature store than organic alone.','In Emerging Markets, where bean type did not matter to customers, I kept ordinary beans.'],
 note:'Organic concerns production and the environment; Fair Trade concerns producer livelihoods and trading terms.',
 anchor:[-4.6,4.35,-4.7],cam:[-3.6,3.3,1.4],tgt:[-4.6,2.5,-4.3]},
{id:'map',name:'Going global',kick:'Station 6 · Going international',title:'In a growing market, <em>start early</em>',
 lede:'Level 3 built a chain across Mature and Emerging Markets. Each run kept what worked and tested one idea, lifting five-year profit from $10.64m to $12.50m.',

 facts:['Opening Emerging stores faster added $952,776, after trailing for two years (a J-curve).','One more Emerging store in Year 1 added $168,920.','Franchises earned $6.45m before shared costs in Run 5, with no capital needed.'],
 note:'Earlier, faster expansion was the best of the schedules tested; a Year 5 Emerging opening was not tested.',

{id:'board',name:'Results board',kick:'Station 7 · The scoreboard',title:'14 of 15 runs <em>beat the target</em>',
 lede:'Five runs at each of three levels, treated as paired experiments. Each level ended at or near its best result.',
 chart:{title:'Best run at each level, % of target',rows:[['Level 1 · one shop',152],['Level 2 · the brand',193],['Level 3 · international',250]],unit:'%',target:100},
 facts:['Best results: $757,947 (Level 1), $963,581 (Level 2) and $12,501,031 (Level 3).','The only miss was the low-price Campus run (99% of target).','14 decision comparisons priced each choice in dollars.'],
 note:'Where conditions were otherwise identical, paired runs isolate the tested change; four comparisons are descriptive.',

];
const DEFAULT={cam:[12.5,10.5,13.5],tgt:[0,1.2,0]};

/* ---------------- Chart helper (inline SVG) ---------------- */
function chartSVG(c){
 const W=340,rowH=34,pad=6,lab=146,w=W-lab-74,H=c.rows.length*rowH+pad;
 const vals=c.rows.map(r=>r[1]);const lo=Math.min(0,c.min??Math.min(...vals));const hi=Math.max(...vals,c.target||0);
 const base=c.min!=null?c.min:0;const x=v=>lab+(v-Math.min(base,lo))/(hi-Math.min(base,lo))*w;const x0=x(Math.max(base,0)>hi?hi:(base>0?base:0));
 const fmt=v=>c.unit==='%'?(v>0&&c.unit&&c.rows.some(r=>r[1]<0)?'+':'')+v+'%':c.money==='m'?'$'+v.toFixed(2)+'m':(v<0?'−$':'+$')+Math.abs(v).toLocaleString('en-US');
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}">`;
 c.rows.forEach((r,i)=>{const y=i*rowH+pad,v=r[1];const xa=Math.min(x0,x(v)),xb=Math.max(x0,x(v));const col=v<0?'var(--loss)':'var(--gain)';
  const lines=r[0].length>22?[r[0].slice(0,r[0].lastIndexOf(' ',22)),r[0].slice(r[0].lastIndexOf(' ',22)+1)]:[r[0]];
  s+=lines.map((t,k)=>`<text x="0" y="${y+(lines.length>1?11+k*12:17)}" font-size="11.5" fill="#3d3731" font-family="DM Sans">${t}</text>`).join('');
  s+=`<rect x="${xa}" y="${y+5}" width="${Math.max(2,xb-xa)}" height="16" rx="4" fill="${col}"/>`;
  const lx=v<0?xa-4:xb+5;s+=`<text x="${lx}" y="${y+17.5}" font-size="11.5" font-weight="700" fill="#3d1a10" text-anchor="${v<0?'end':'start'}" font-family="DM Sans">${fmt(v)}</text>`;});
 s+=`<line x1="${x0}" x2="${x0}" y1="2" y2="${H}" stroke="#171513" stroke-width="1"/>`;
 if(c.target){const xt=x(c.target);s+=`<line x1="${xt}" x2="${xt}" y1="0" y2="${H}" stroke="#b65f36" stroke-dasharray="3 3"/><text x="${xt+3}" y="${H-1}" font-size="9.5" fill="#b5543a" font-family="DM Sans">target</text>`}
 return s+'</svg>';
}

/* ---------------- Panel + tour UI ---------------- */
const $=s=>document.querySelector(s);let current=-1;
const dots=$('#dots');STATIONS.forEach((st,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=st.name;b.setAttribute('aria-label',`Station ${i+1}: ${st.name}`);b.onclick=()=>go(i);dots.appendChild(b)});
function fill(i){const s=STATIONS[i];$('#pKick').textContent=s.kick;$('#pTitle').innerHTML=s.title;$('#pLede').textContent=s.lede;
 $('#pChart').innerHTML=`<h4>${s.chart.title}</h4>`+chartSVG(s.chart);$('#pFacts').innerHTML=s.facts.map(f=>`<li>${f}</li>`).join('');
 $('#pNote').textContent=s.note+' '+SRC;$('#prev').disabled=false;$('#next').textContent=i===STATIONS.length-1?'Back to the start ↺':'Next stop →'}
/* fallback (no WebGL) */
function fallback(){$('#loader').classList.add('hide');$('#hint').style.display='none';document.querySelector('.dock').style.display='none';
 $('#fallback').classList.add('show');$('#fbGrid').innerHTML=STATIONS.map(s=>`<article><div class="kick">${s.kick}</div><h2 style="font:600 24px 'Playfair Display',serif;margin:8px 0">${s.title}</h2><p class="lede">${s.lede}</p><div class="chart"><h4>${s.chart.title}</h4>${chartSVG(s.chart)}</div><ul class="facts">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul><p class="note">${s.note}</p></article>`).join('')}

await Promise.race([Promise.all(['600 40px "Playfair Display"','italic 600 40px "Playfair Display"','500 40px "DM Sans"','700 40px "DM Sans"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);
let renderer;
try{const t=document.createElement('canvas');if(!(t.getContext('webgl2')||t.getContext('webgl')))throw 0;
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:false});}catch(e){fallback();throw new Error('no webgl')}

/* ---------------- Scene ---------------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=THREE.SRGBColorSpace;
$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=null;scene.fog=new THREE.Fog('#f1e2c8',30,56);

const arrowShape=(x0,L,H,tip,dir)=>{const sh=new THREE.Shape();const P=dir>0?[[x0,-H/2],[x0+L-tip,-H/2],[x0+L,0],[x0+L-tip,H/2],[x0,H/2]]:[[-x0,-H/2],[-x0,H/2],[-x0-L+tip,H/2],[-x0-L,0],[-x0-L+tip,-H/2]];sh.moveTo(...P[0]);P.slice(1).forEach(p=>sh.lineTo(...p));sh.closePath();return sh};
const uvFit=(geo)=>{geo.computeBoundingBox();const b=geo.boundingBox,uv=geo.attributes.uv,p=geo.attributes.position;for(let k=0;k<p.count;k++)uv.setXY(k,(p.getX(k)-b.min.x)/(b.max.x-b.min.x),(p.getY(k)-b.min.y)/(b.max.y-b.min.y));return geo};
[['City Centre','$740,214','#d39543',2.75,.45],['Suburb','$662,589','#8fa98a',2.25,.7],['Campus','$494,089','#ecaaa1',1.75,.95]].forEach(([t,v,c,y,r])=>{
 const X0=.1,L=2.05,H=.36,TIP=.16;
 const tex=pad=>canvasTex(760,144,(g,w,h)=>{g.fillStyle='#fbf3e3';g.fillRect(0,0,w,h);g.strokeStyle='#7a3320';g.lineWidth=6;g.strokeRect(9,9,w-18,h-18);g.fillStyle=c;g.save();g.translate(pad+22,h/2);g.rotate(.785);g.fillRect(-15,-15,30,30);g.strokeStyle='#7a3320';g.lineWidth=3;g.strokeRect(-15,-15,30,30);g.restore();g.textBaseline='middle';g.fillStyle='#3d1a10';g.font='italic 600 44px "Playfair Display",serif';g.fillText(t,pad+60,h/2+2);const tw=g.measureText(t).width;g.fillStyle='#7a3320';g.font='700 40px "DM Sans",sans-serif';g.fillText(v,pad+60+tw+26,h/2+2);});
 const pv=new THREE.Group();pv.position.y=y;pv.rotation.y=r;post.add(pv);
 const body=new THREE.Mesh(new THREE.ExtrudeGeometry(arrowShape(X0,L,H,TIP,1),{depth:.05,bevelEnabled:false}),M('#7a3320',{r:.5}));body.position.z=-.025;body.castShadow=true;pv.add(body);
 const front=new THREE.Mesh(uvFit(new THREE.ShapeGeometry(arrowShape(X0,L,H,TIP,1))),M('#ffffff',{map:tex(34),r:.6}));front.position.z=.027;pv.add(front);
 const back=new THREE.Mesh(uvFit(new THREE.ShapeGeometry(arrowShape(X0,L,H,TIP,-1))),M('#ffffff',{map:tex(88),r:.6}));back.rotation.y=Math.PI;back.position.z=-.027;pv.add(back);
 const br=box(.12,.05,.08,brass,.07,.12,0,pv);box(.12,.05,.08,brass,.07,-.12,0,pv)});
const cap=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),brass);cap.position.y=3.22;post.add(cap);

/* ---- Seating: rosewood armchairs with floral cushions, marble-top tables ---- */
const rose=M('#7a3320',{r:.45});
const floral=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#f2c4b4';g.fillRect(0,0,w,h);for(let i=0;i<14;i++){const x=Math.random()*w,y=Math.random()*h,r=14+Math.random()*16;for(let p=0;p<8;p++){const a=p*.785;g.fillStyle=['#e57b4f','#d9634a','#f0a05a'][i%3];g.beginPath();g.ellipse(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.4,r*.18,a,0,7);g.fill()}g.fillStyle='#5d7d4a';g.beginPath();g.ellipse(x+r,y+r*.6,r*.6,r*.22,.6,0,7);g.fill()}});
const cushM=M('#ffffff',{r:.95,map:floral});
function armchair(parent){const c=new THREE.Group();parent.add(c);
 for(const [dx,dz] of[[-.27,-.25],[.27,-.25],[-.27,.25],[.27,.25]])cyl(.03,.025,.78,rose,dx,.39,dz,10,c);
 box(.6,.05,.56,rose,0,.42,0,c);box(.54,.1,.5,cushM,0,.5,0,c);box(.52,.36,.08,cushM,0,.75,.22,c);
 box(.6,.04,.04,rose,0,.96,.26,c);for(let k=-2;k<=2;k++)cyl(.012,.012,.42,rose,k*.12,.74,.27,6,c);
 for(const dx of[-.29,.29]){box(.05,.04,.56,rose,dx,.74,0,c);for(let k=-1;k<=1;k++)cyl(.012,.012,.28,rose,dx,.6,k*.17,6,c)}return c}
function table(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
 cyl(.55,.55,.05,marble,0,.8,0,48,g);cyl(.5,.5,.08,rose,0,.74,0,40,g);cyl(.07,.09,.7,rose,0,.38,0,14,g);cyl(.32,.36,.06,rose,0,.04,0,24,g);
 for(const a of[0,Math.PI,Math.PI/2]){const c=armchair(g);c.position.set(Math.cos(a)*.95,0,Math.sin(a)*.95);c.rotation.y=-a-Math.PI/2}
 return g}
const t1=table(-2.6,1.6,.3),t2=table(2.4,2.1,-.4);const t3=table(-5.8,1.5,.2),t4=table(-0.2,4.5,.7),t5=table(3.4,4.6,-.2),t6=table(5.2,.3,.5),t7=table(-6.7,-3.7,.4);cup(.1,.1,t3,.83);cup(-.2,.1,t5,.83);cup(.15,-.1,t6,.83);cup(-.15,.05,t1,.83);cup(.2,-.1,t2,.83);
/* oversized sage pots with banana-leaf plants */
const potM=M('#b9ccb3',{r:.55}),leafM=new THREE.MeshStandardMaterial({color:'#3f7a3a',roughness:.6,side:THREE.DoubleSide}),leafM2=new THREE.MeshStandardMaterial({color:'#5b9446',roughness:.6,side:THREE.DoubleSide});
const leafShape=(()=>{const sh=new THREE.Shape();sh.moveTo(0,0);sh.bezierCurveTo(.16,.15,.17,.75,0,1);sh.bezierCurveTo(-.17,.75,-.16,.15,0,0);return new THREE.ShapeGeometry(sh,12)})();
function plant(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
 const pot=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[.22,0],[.4,.12],[.48,.36],[.44,.6],[.3,.74],[.3,.78],[0,.78]].map(p=>new THREE.Vector2(...p)),32),potM);pot.castShadow=pot.receiveShadow=true;g.add(pot);
 for(let i=0;i<7;i++){const a=i*0.9+Math.random()*.3,h=1.0+Math.random()*.9,tilt=.18+Math.random()*.25;const st=new THREE.Group();st.position.set(0,.72,0);st.rotation.set(0,a,tilt);g.add(st);
  cyl(.015,.02,h,M('#5d7d3a'),0,h/2,0,6,st);const lf=new THREE.Mesh(leafShape,i%2?leafM:leafM2);lf.scale.set(.75,.95,1);lf.position.set(0,h-.05,0);lf.rotation.set(0,Math.random()*.6,.25);lf.castShadow=true;st.add(lf)}}
plant(-8.2,-5.3,1.15);plant(-8.1,-2.95,1.05);plant(7.6,-5.2,1.05);plant(-6.4,-5.35,.9);plant(8.55,1.75,.95);plant(8.55,5.15,.95);

/* ---- Steam ---- */
const steamTex=canvasTex(128,256,(g,w,h)=>{const r=g.createLinearGradient(0,0,0,h);r.addColorStop(0,'rgba(255,255,255,0)');r.addColorStop(.5,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.beginPath();g.moveTo(w/2,0);g.bezierCurveTo(0,h*.3,w,h*.6,w/2,h);g.lineWidth=26;g.strokeStyle=r;g.stroke()});
const steams=[];function steam(x,y,z){for(let k=0;k<2;k++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:steamTex,transparent:true,depthWrite:false,opacity:.5}));s.scale.set(.22,.5,1);s.position.set(x,y,z);s.userData={x,y,z,o:k*.5};scene.add(s);steams.push(s)}}
steam(.9,1.75,-4.6);steam(1.6,1.75,-4.7);steam(2.3,1.75,-4.55);steam(-2.6,1.55,1.6);steam(2.4,1.55,2.1);

/* ---------------- Pins ---------------- */
const pins=STATIONS.map((s,i)=>{const b=document.createElement('button');b.className='pin';b.innerHTML=`<span class="n">${i+1}</span><span class="t">${s.name}</span>`;b.setAttribute('aria-label',`Station ${i+1}: ${s.name}`);b.onclick=()=>go(i);document.body.appendChild(b);return{b,v:new THREE.Vector3(...s.anchor)}});

/* ---------------- Camera moves ---------------- */
let tween=null,lastInput=performance.now(),offX=0,offY=0;const mob=()=>innerWidth<=760;
const offTarget=()=>current<0?[0,0]:mob()?[0,0]:[Math.min(230,innerWidth*.16),0];
function fly(cam,tgt,dur=1500){if(RM){camera.position.set(...cam);controls.target.set(...tgt);return}
 tween={t0:performance.now(),dur,pc:camera.position.clone(),pt:controls.target.clone(),cc:new THREE.Vector3(...cam),ct:new THREE.Vector3(...tgt)}}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mobileAdjust(cam,tgt,dy=2.1){if(!mob())return[cam,tgt];const c=new THREE.Vector3(...cam),t=new THREE.Vector3(...tgt);const d=c.clone().sub(t);c.add(d.multiplyScalar(.3));c.y+=.8;return[c.toArray(),[tgt[0],tgt[1]-dy,tgt[2]]]}
const homeView=()=>{if(!mob())return[DEFAULT.cam,DEFAULT.tgt];const c=new THREE.Vector3(...DEFAULT.cam).multiplyScalar(1.55);return[c.toArray(),DEFAULT.tgt]};
function go(i){current=i;fill(i);$('#pScroll').scrollTop=0;$('#panel').classList.add('open');const[c,t]=mobileAdjust(STATIONS[i].cam,STATIONS[i].tgt,[2.1,0.7,2.1,2.1,1.6,1.4,2.1][i]);fly(c,t);
 [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));pins.forEach((p,k)=>p.b.classList.toggle('on',k===i));$('#tour').textContent='Restart tour';controls.autoRotate=false;lastInput=performance.now()}
function freeLook(){current=-1;$('#panel').classList.remove('open');[...dots.children].forEach(d=>d.classList.remove('on'));pins.forEach(p=>p.b.classList.remove('on'));fly(...homeView());lastInput=performance.now()}
$('#next').onclick=()=>current>=STATIONS.length-1?go(0):go(current+1);$('#prev').onclick=()=>go(current<=0?STATIONS.length-1:current-1);
$('#close').onclick=freeLook;$('#free').onclick=freeLook;$('#tour').onclick=()=>go(0);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#next').click();else if(e.key==='ArrowLeft'&&current>=0)$('#prev').click();else if(e.key==='Escape')freeLook()});
controls.addEventListener('start',()=>{lastInput=performance.now();tween=null;controls.autoRotate=false;$('#hint').style.opacity=0});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;offX=-1;offY=-1;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ---------------- Loop ---------------- */
const tmp=new THREE.Vector3();
function frame(now){
 if(tween){const p=Math.min(1,(now-tween.t0)/tween.dur),e=ease(p);camera.position.lerpVectors(tween.pc,tween.cc,e);controls.target.lerpVectors(tween.pt,tween.ct,e);if(p>=1)tween=null}
 if(!RM&&current<0&&!tween&&now-lastInput>7000)controls.autoRotate=true;
 controls.update();
 const [tx,ty]=offTarget();if(Math.abs(offX-tx)>.5||Math.abs(offY-ty)>.5){const k=RM?1:.08;offX+=(tx-offX)*k;offY+=(ty-offY)*k;camera.setViewOffset(innerWidth,innerHeight,offX,offY,innerWidth,innerHeight)}
 const T=now/1000;steams.forEach(s=>{const u=((T*.35+s.userData.o)%1);s.position.set(s.userData.x+Math.sin(T*1.5+s.userData.o*6)*.03,s.userData.y+u*.45,s.userData.z);s.material.opacity=Math.sin(u*Math.PI)*.45});
 drum.rotation.x=RM?0:T*.8;arm.rotation.y=RM?0:T*.35;
 renderer.render(scene,camera);
 pins.forEach(p=>{tmp.copy(p.v).project(camera);const vis=tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;p.b.style.display=vis?'flex':'none';
  if(vis)p.b.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-17px,-17px)`});
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);setTimeout(()=>$('#loader').classList.add('hide'),500);
</script>
